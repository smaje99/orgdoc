[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "media-report-cli"
version = "0.1.0"
description = "CLI to turn local audio or video files into structured Markdown and PDF reports."
readme = "docs/migration/media-report-cli-compatibility.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "smaje" },
]
keywords = ["cli", "media", "transcription", "reporting", "whisper", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "pydantic-ai-slim[openai]==1.22.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "rich==15.0.0",
  "tomli-w==1.2.0",
  "typer==0.26.7",
]

[project.optional-dependencies]
transcription = [
  "faster-whisper==1.2.1",
]
dev = [
  "build==1.5.0",
  "pipx==1.7,<2",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.15.17",
  "twine==7.0.0",
  "ty==0.0.49",
]
all = [
  "faster-whisper==1.2.1",
]

[project.urls]
Homepage = "https://github.com/smaje99/media-report-cli"
Repository = "https://github.com/smaje99/media-report-cli"
Issues = "https://github.com/smaje99/media-report-cli/issues"
Documentation = "https://github.com/smaje99/media-report-cli/tree/main/docs"
Changelog = "https://github.com/smaje99/media-report-cli/blob/main/CHANGELOG.md"

[project.scripts]
media-report = "media_report.cli.app:main"

[tool.hatch.build]
include = [
  "/src/media_report/templates/**/*.md",
  "/src/media_report/templates/**/*.tex",
  "/docs/**/*.md",
  "/skills/**/*.md",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/media_report"]

[tool.ruff]
indent-width = 2
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ty.src]
include = ["src", "tests"]
