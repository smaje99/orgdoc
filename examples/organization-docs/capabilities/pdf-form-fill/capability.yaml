schema_version: 1
id: pdf-form-fill
version: 1.0.0
description: Fill an organization-scoped AcroForm template and preserve its source PDF.
input_schema: input.schema.json
output_schema: output.schema.json
runtime: python
entrypoint:
  - orgdoc-fill-pdf-form
resource_class: memory
platforms:
  - linux
  - darwin
permissions:
  - filesystem:read_organization
  - filesystem:write_artifact_dir
timeout_seconds: 120
max_output_bytes: 10485760
