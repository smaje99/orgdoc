schema_version: 1
id: presentation-pptx
version: 1.0.0
description: Render structured, branded slides as an editable PowerPoint presentation.
input_schema: input.schema.json
output_schema: output.schema.json
runtime: python
entrypoint:
  - orgdoc-render-presentation
resource_class: memory
platforms:
  - linux
  - darwin
permissions:
  - filesystem:read_organization
  - filesystem:write_artifact_dir
timeout_seconds: 120
max_output_bytes: 1048576
