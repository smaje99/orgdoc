[project]
name = "orgdoc-pdf-form-worker"
version = "0.1.0"
description = "Isolated AcroForm generator and filler for OrgDoc"
requires-python = ">=3.10"
dependencies = ["pypdf==6.4.1", "reportlab==5.0.1"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
orgdoc-generate-pdf-form = "orgdoc_pdf_form.worker:main_generate"
orgdoc-fill-pdf-form = "orgdoc_pdf_form.worker:main_fill"

[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orgdoc_pdf_form"]

[tool.pytest.ini_options]
pythonpath = ["src"]
