[project]
name = "orgdoc-narrative-report-worker"
version = "0.1.0"
description = "Isolated Markdown narrative report renderer for OrgDoc"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
orgdoc-render-report = "orgdoc_report.worker:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orgdoc_report"]
