[project]
name = "orgdoc-presentation-worker"
version = "0.1.0"
description = "Isolated python-pptx presentation renderer for OrgDoc"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "python-pptx==1.0.2"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
orgdoc-render-presentation = "orgdoc_presentation.worker:main"

[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orgdoc_presentation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
